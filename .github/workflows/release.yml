name: 'Release'

# 触发条件：当你推送格式为 v*.*.* 的标签时自动运行，比如 v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}

    steps:
      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: SIP Session Analyzer ${{ github.ref_name }}
          body: |
            SIP Session Analyzer ${{ github.ref_name }} 版本发布

            请下载对应平台的安装包。
          draft: false
          prerelease: false

  build-and-upload:
    name: Build ${{ matrix.platform }}
    needs: create-release
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install WebView2 (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install webview2-runtime -y
        shell: powershell

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
